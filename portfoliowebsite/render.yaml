services:
  - type: web
    name: nishant-portfolio
    runtime: python
    plan: free
    autoDeploy: true
    rootDir: portfoliowebsite
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py ensure_superuser && gunicorn portfoliowebsite.wsgi:application --workers 1
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: nishant-portfolio-db
          property: connectionString
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: Nishantsingh1721@gmail.com
      - key: DJANGO_SUPERUSER_PASSWORD
        generateValue: true

databases:
  - name: nishant-portfolio-db
    plan: free
