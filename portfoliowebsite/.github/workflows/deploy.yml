name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Trigger Render deploy
    runs-on: ubuntu-latest
    steps:
      - name: Call Render deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::The RENDER_DEPLOY_HOOK_URL secret is not set."
            echo "Set it in GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "Triggering deployment..."
          curl --fail --silent --show-error \
            --request POST "$DEPLOY_HOOK"
