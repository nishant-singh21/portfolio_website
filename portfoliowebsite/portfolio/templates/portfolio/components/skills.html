<section class="section section-alt" id="skills">
  <div class="container">
    <div class="section-head reveal">
      <p class="section-kicker">// skills</p>
      <h2 class="section-title">Technical <span class="grad-text">Skills</span></h2>
      <p class="section-sub">The tools and technologies I use to build backend systems end to end.</p>
    </div>

    <div class="skills-grid">
      {% for group in skill_groups %}
      <div class="skill-card glass reveal">
        <div class="skill-card-head">
          <span class="skill-icon" aria-hidden="true">
            <svg class="icon"><use href="#i-{{ group.icon }}"></use></svg>
          </span>
          <h3 class="skill-card-title">{{ group.title }}</h3>
        </div>
        <ul class="skill-list">
          {% for skill in group.skills %}
          <li class="skill-chip">{{ skill }}</li>
          {% endfor %}
        </ul>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
