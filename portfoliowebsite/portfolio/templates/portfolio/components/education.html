<section class="section" id="education">
  <div class="container">
    <div class="section-head reveal">
      <p class="section-kicker">// education</p>
      <h2 class="section-title">Education &amp; <span class="grad-text">Training</span></h2>
      <p class="section-sub">My academic journey in Computer Science.</p>
    </div>

    <div class="edu-list">
      {% for edu in education %}
      <article class="edu-item reveal">
        <div class="edu-marker" aria-hidden="true"></div>
        <div class="edu-card glass">
          <div class="edu-head">
            <div>
              <h3 class="edu-degree">{{ edu.degree }}</h3>
              <p class="edu-institution">
                <svg class="icon" aria-hidden="true"><use href="#i-graduation"></use></svg>
                {{ edu.institution }}
              </p>
            </div>
            <span class="edu-period">{{ edu.period }}</span>
          </div>
        </div>
      </article>
      {% endfor %}
    </div>
  </div>
</section>
