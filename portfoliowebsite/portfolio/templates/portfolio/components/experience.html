<section class="section" id="experience">
  <div class="container">
    <div class="section-head reveal">
      <p class="section-kicker">// experience</p>
      <h2 class="section-title">Work <span class="grad-text">Experience</span></h2>
      <p class="section-sub">Where I've applied my skills building real-world software.</p>
    </div>

    <div class="timeline">
      {% for job in experience %}
      <article class="timeline-item reveal">
        <div class="timeline-marker" aria-hidden="true"></div>
        <div class="timeline-card glass">
          <div class="timeline-card-head">
            <div>
              <h3 class="timeline-role">{{ job.role }}</h3>
              <p class="timeline-company">
                <svg class="icon" aria-hidden="true"><use href="#i-briefcase"></use></svg>
                {{ job.company }}
              </p>
            </div>
            <span class="timeline-period">{{ job.period }}</span>
          </div>
          <ul class="timeline-points">
            {% for point in job.points %}
            <li>{{ point }}</li>
            {% endfor %}
          </ul>
        </div>
      </article>
      {% endfor %}
    </div>
  </div>
</section>
